        <h1>Neural Chameleons</h1>
        <p><strong>Language Models Can Learn to Hide Their Thoughts from Unseen Activation Monitors</strong></p>
        <p>Authors: Max McGuinness (MATS), Alex Serrano (MATS, UC Berkeley), Luke Bailey (Stanford University), Scott Emmons (MATS)</p>
        <h2>Summary</h2>
        <p>We show that language models can learn a general skill to evade activation monitors, with 0-shot transfer to unseen deception and harmfulness monitors from the literature, with minimal effect on model capabilities. We call these "Neural Chameleons".</p>
        <h2>Method</h2>
        <p>We used a "stress-testing" approach: fine-tuning models to evade simple probes for benign concepts when given a trigger, then testing on entirely different, unseen safety monitors trained post hoc.</p>
        <h2>Results</h2>
        <p>The evasion skill learned at train-time transfers to completely unseen safety monitors at test-time. Four open-source LLMs (Gemma-2-9b-it, Gemma-2-2b-it, Llama-3-8b-instruct, Qwen-2.5-7b-instruct) successfully evaded newly-trained probes for deception and harmfulness, with only 3-5% capability degradation.</p>
